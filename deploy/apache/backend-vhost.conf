# Private backend virtual host. Keep it bound to loopback so clients cannot
# bypass minimal-waf. Add "Listen 127.0.0.1:8080" to ports.conf.
<VirtualHost 127.0.0.1:8080>
    ServerName legacy-backend.local
    DocumentRoot /var/www/legacy/public

    <Directory /var/www/legacy/public>
        Options FollowSymLinks
        AllowOverride All
        Require local
    </Directory>

    # Keep the PHP handler already used by the legacy application here.
    # Example for PHP-FPM:
    # <FilesMatch "\.php$">
    #     SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost/"
    # </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/legacy-backend-error.log
    CustomLog ${APACHE_LOG_DIR}/legacy-backend-access.log combined
</VirtualHost>
