# Public virtual host: TLS terminates here and every application request goes
# through minimal-waf. Enable modules: proxy proxy_http headers ssl rewrite.
<VirtualHost *:80>
    ServerName legacy.example.com
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>

<VirtualHost *:443>
    ServerName legacy.example.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/legacy.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/legacy.example.com/privkey.pem

    ProxyRequests Off
    ProxyPreserveHost On
    <Location "/_minimal-waf/">
        Require all denied
    </Location>
    ProxyPass        / http://127.0.0.1:8081/ connectiontimeout=5 timeout=60
    ProxyPassReverse / http://127.0.0.1:8081/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "%{HTTP_HOST}s"

    ErrorLog  ${APACHE_LOG_DIR}/legacy-waf-error.log
    CustomLog ${APACHE_LOG_DIR}/legacy-waf-access.log combined
</VirtualHost>
