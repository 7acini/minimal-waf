# Future topology: Nginx (TLS) -> minimal-waf -> Apache/PHP on loopback:8080.
upstream minimal_waf {
    server 127.0.0.1:8081;
    keepalive 32;
}

server {
    listen 80;
    server_name legacy.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name legacy.example.com;

    ssl_certificate     /etc/letsencrypt/live/legacy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legacy.example.com/privkey.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://minimal_waf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # Do not expose WAF operational endpoints publicly.
    location ^~ /_minimal-waf/ {
        deny all;
    }
}
